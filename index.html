<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai Apartments for Rent | Silk Road Holiday Homes</title>
<meta name="description" content="Book short-term apartments in Dubai Marina, JBR and Palm Jumeirah directly from Silk Road Holiday Homes, Airbnb Superhost since 2014. Self check-in, best rates without booking fees.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container">
  <div class="breadcrumbs"><a href="#">Main</a><span>/</span>Catalog</div>
  <h1 class="page-title">Apartments in Dubai</h1>
  <p class="page-lead">Short-term beachfront apartments from <span class="script">Silk Road Holiday Homes</span>, Airbnb Superhost since 2014. Book directly, pay online and get self check-in details right after payment.</p>

  <form class="filter" id="filter">
    <label><small>Area</small>
      <select id="f-area"><option value="">All areas</option></select>
    </label>
    <label><small>Check-in</small><input type="date" id="f-in"></label>
    <label><small>Check-out</small><input type="date" id="f-out"></label>
    <label><small>Guests</small>
      <select id="f-guests">
        <option value="1">1 guest</option><option value="2" selected>2 guests</option><option value="3">3 guests</option>
        <option value="4">4 guests</option><option value="5">5 guests</option><option value="6">6 guests</option><option value="7">7 guests</option>
      </select>
    </label>
    <button class="btn" type="submit"><img src="assets/img/search-icon.svg" alt="" width="22"> Search</button>
  </form>

  <div class="filter-meta">
    <span id="count"></span>
    <div class="chip-row">
      <button type="button" class="chip on" data-bed="any">Any size</button>
      <button type="button" class="chip" data-bed="0">Studio</button>
      <button type="button" class="chip" data-bed="1">1 bedroom</button>
      <button type="button" class="chip" data-bed="2">2 bedrooms</button>
      <button type="button" class="chip" data-bed="3">3+ bedrooms</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div id="site-footer"></div>
<script src="assets/app.js"></script>
<script>initCatalog();</script>
</body>
</html>
